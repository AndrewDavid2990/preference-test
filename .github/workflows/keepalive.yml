# Keeps the free Supabase project from pausing. Supabase pauses free projects after 7 days
# with no activity; this makes one harmless read every 3 days. The key below is the public
# anon key, the same one that is in config.js.
name: Keep database awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_ZeVQCGRIX3lJcS9nv7oJTw_rsHnx22m" \
            -H "Authorization: Bearer sb_publishable_ZeVQCGRIX3lJcS9nv7oJTw_rsHnx22m" \
            "https://eajbqxaamwpqaumncklw.supabase.co/rest/v1/tests?select=id&limit=1"
